<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings - Tryixa</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animation.css"></head>
<body data-page="settings">
  <div class="app-shell"><aside class="app-sidebar"></aside><main class="app-main"><header class="app-topbar"></header><div class="page-container content-grid">
    <section class="stack" data-endpoint="/api/settings">
      <header class="page-header"><div><h1 class="page-title">Settings</h1><p class="page-subtitle">Account, privacy, notifications, theme, security, uploads, and data controls.</p></div></header>
      <section class="settings-card"><h2>Account</h2><form id="settings-account-form" class="form-grid two"><div class="field"><label for="settings-name-input">Display name</label><input id="settings-name-input" name="name" type="text" value="Alex Creator"></div><div class="field"><label for="settings-username-input">Username</label><input id="settings-username-input" name="username" type="text" value="alex"></div><button id="settings-save-account-btn" class="btn btn-primary" type="submit">Save Account</button></form></section>
      <section class="settings-card"><h2>Preferences</h2><div class="grid-2"><button id="settings-theme-btn" class="btn btn-secondary" type="button">Toggle Theme</button><button id="settings-data-btn" class="btn btn-secondary" type="button">Download Data</button></div></section>
      <section class="settings-card danger-zone"><h2>Danger Zone</h2><p>Reserved for account deactivation, deletion, and device logout flows.</p><button id="settings-delete-btn" class="btn btn-danger" type="button">Delete Account</button></section>
    </section>
    <aside class="right-rail"><section class="rail-card" id="settings-security-section"></section><section class="rail-card" id="settings-plan-section"></section></aside>
  </div></main></div><nav class="mobile-nav"></nav>
  <script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/navigation.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
</body></html>
