<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications - Tryixa</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animation.css"></head>
<body data-page="notifications">
  <div class="app-shell"><aside class="app-sidebar"></aside><main class="app-main"><header class="app-topbar"></header><div class="page-container content-grid">
    <section class="stack" data-endpoint="/api/notifications">
      <header class="page-header"><div><h1 class="page-title">Notifications</h1><p class="page-subtitle">Likes, comments, follows, mentions, moderation, and creator alerts.</p></div><button id="notifications-read-btn" class="btn btn-primary" type="button">Mark all read</button></header>
      <section class="tabs"><button id="notifications-tab-all" class="tab-btn active" type="button">All</button><button id="notifications-tab-mentions" class="tab-btn" type="button">Mentions</button><button id="notifications-tab-system" class="tab-btn" type="button">System</button></section>
      <section class="stack" id="notifications-list-section"></section>
    </section>
    <aside class="right-rail"><section class="rail-card" id="notification-settings-card"></section></aside>
  </div></main></div><nav class="mobile-nav"></nav>
  <script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/navigation.js"></script><script src="js/notification.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
</body></html>
