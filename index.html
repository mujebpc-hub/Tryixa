<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tryixa - Home Feed</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animation.css">
</head>
<body data-page="home">
  <div class="app-shell">
    <aside class="app-sidebar"></aside>
    <main class="app-main">
      <header class="app-topbar"></header>
      <div class="page-container content-grid">
        <section class="stack feed-area" data-endpoint="/api/feed/home">
          <section class="panel stories-strip" id="stories-section" data-endpoint="/api/stories"></section>
          <section class="composer-card" id="composer-section">
            <div class="composer-row">
              <span class="avatar">A</span>
              <button id="composer-open-btn" class="composer-trigger" type="button">What's on your mind, Alex?</button>
            </div>
            <div class="composer-tools">
              <button id="composer-photo-btn" type="button">Photo/Video</button>
              <button id="composer-reel-btn" type="button">Create Reel</button>
              <button id="composer-live-btn" type="button">Go Live</button>
              <button id="composer-ai-btn" type="button">AI Post</button>
            </div>
          </section>
          <section class="stack" id="feed-posts-section" data-endpoint="/api/posts"></section>
        </section>
        <aside class="right-rail" id="home-right-rail">
          <section class="rail-card" id="suggestions-section" data-endpoint="/api/users/suggestions"></section>
          <section class="rail-card" id="trending-section" data-endpoint="/api/trends"></section>
          <section class="rail-card" id="ai-assistant-section">
            <h2>AI Assistant</h2>
            <p>Generate captions, content ideas, replies, and post plans.</p>
            <a id="home-ai-link" class="btn btn-primary btn-full" href="ai.html">Start AI Chat</a>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <nav class="mobile-nav"></nav>
  <script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/navigation.js"></script><script src="js/story.js"></script><script src="js/feed.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
</body>
</html>
