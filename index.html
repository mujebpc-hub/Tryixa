<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tryixa</title>

    <meta name="description" content="Tryixa - AI Powered Social Media Platform">
    <meta name="theme-color" content="#000000">

    <link rel="icon" href="assets/logo/favicon.png">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animation.css">

</head>

<body>

<div id="app">

    <!-- ========================= -->
    <!-- Top Navigation -->
    <!-- ========================= -->

    <header class="top-navbar">

        <div class="logo">

            <img src="assets/logo/logo.png" alt="Tryixa">

            <h2>Tryixa</h2>

        </div>

        <div class="nav-icons">

            <button id="notificationBtn">

                🔔

            </button>

            <button id="messageBtn">

                💬

            </button>

        </div>

    </header>



    <!-- ========================= -->
    <!-- Story Section -->
    <!-- ========================= -->

    <section id="stories">

        <!-- Story Cards JS se load hongi -->

    </section>



    <!-- ========================= -->
    <!-- Feed -->
    <!-- ========================= -->

    <main id="feed">

        <!-- Random Posts -->

    </main>



    <!-- ========================= -->
    <!-- Floating Create Button -->
    <!-- ========================= -->

    <button id="createPost">

        +

    </button>



    <!-- ========================= -->
    <!-- Bottom Navigation -->
    <!-- ========================= -->

    <nav class="bottom-nav">

        <a href="#">

            <span>🏠</span>

            <small>Home</small>

        </a>

        <a href="#">

            <span>🔍</span>

            <small>Explore</small>

        </a>

        <a href="#">

            <span>🎬</span>

            <small>Reels</small>

        </a>

        <a href="#">

            <span>💬</span>

            <small>Chat</small>

        </a>

        <a href="#">

            <span>👤</span>

            <small>Profile</small>

        </a>

    </nav>

    <!-- ========================= -->
<!-- Search Overlay -->
<!-- ========================= -->

<section id="searchOverlay" class="overlay hidden">

    <div class="search-box">

        <input
            type="text"
            placeholder="Search Tryixa..."
            id="searchInput"
        >

    </div>

    <div id="searchResults">

        <!-- Search Results -->

    </div>

</section>


<!-- ========================= -->
<!-- Notification Panel -->
<!-- ========================= -->

<section id="notificationPanel" class="hidden">

    <h3>Notifications</h3>

    <div id="notificationList">

        <!-- Notifications -->

    </div>

</section>


<!-- ========================= -->
<!-- Chat Popup -->
<!-- ========================= -->

<section id="chatPopup" class="hidden">

    <h3>Messages</h3>

    <div id="chatList">

        <!-- Chats -->

    </div>

</section>


<!-- ========================= -->
<!-- Profile Popup -->
<!-- ========================= -->

<section id="profilePopup" class="hidden">

    <div class="profile-card">

        <img
            src="assets/images/default-user.jpg"
            alt="User"
        >

        <h2>Tryixa User</h2>

        <p>@tryixa_user</p>

    </div>

</section>


<!-- ========================= -->
<!-- Loading Screen -->
<!-- ========================= -->

<div id="loader">

    <div class="loader-circle"></div>

    <h2>TRYIXA</h2>

</div>


<!-- ========================= -->
<!-- Toast Message -->
<!-- ========================= -->

<div id="toast">

    Welcome to Tryixa

</div>


<!-- ========================= -->
<!-- Modal Container -->
<!-- ========================= -->

<div id="modalContainer">

</div>


<!-- ========================= -->
<!-- Popup Container -->
<!-- ========================= -->

<div id="popupContainer">

</div>


<!-- ========================= -->
<!-- Desktop Left Sidebar -->
<!-- ========================= -->

<aside id="leftSidebar">

</aside>


<!-- ========================= -->
<!-- Desktop Right Sidebar -->
<!-- ========================= -->

<aside id="rightSidebar">

</aside>
    
</div>

<script src="js/navigation.js"></script>
<script src="js/story.js"></script>
<script src="js/feed.js"></script>
<script src="js/reels.js"></script>
<script src="js/chat.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>

</body>

</html>
