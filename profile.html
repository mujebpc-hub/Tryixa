<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profile - Tryixa</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animation.css"></head>
<body data-page="profile">
  <div class="app-shell"><aside class="app-sidebar"></aside><main class="app-main"><header class="app-topbar"></header><div class="page-container content-grid">
    <section class="stack" data-endpoint="/api/users/:username">
      <section class="panel" id="profile-hero-section"><div class="profile-header-row"><span class="avatar avatar-lg">A</span><div><h1 class="page-title">Alex Creator</h1><p class="page-subtitle">@alex - Digital creator - Building Tryixa stories</p></div><button id="profile-edit-btn" class="btn btn-primary" type="button">Edit Profile</button></div></section>
      <section class="grid-3" id="profile-stats-section"><article class="card metric-card"><span class="muted">Posts</span><div class="metric-value">248</div></article><article class="card metric-card"><span class="muted">Followers</span><div class="metric-value">82.4K</div></article><article class="card metric-card"><span class="muted">Following</span><div class="metric-value">512</div></article></section>
      <section class="tabs"><button id="profile-tab-posts" class="tab-btn active" type="button">Posts</button><button id="profile-tab-reels" class="tab-btn" type="button">Reels</button><button id="profile-tab-saved" class="tab-btn" type="button">Saved</button></section>
      <section class="grid-3" id="profile-content-grid"></section>
    </section>
    <aside class="right-rail"><section class="rail-card" id="profile-about-section"></section><section class="rail-card" id="profile-badges-section"></section></aside>
  </div></main></div><nav class="mobile-nav"></nav>
  <script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/navigation.js"></script><script src="js/profile.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
</body></html>
