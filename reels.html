<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels - Tryixa</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/animation.css">
</head>
<body data-page="reels">
  <div class="app-shell">
    <aside class="app-sidebar"></aside>
    <main class="app-main">
      <header class="app-topbar"></header>
      <div class="page-container three-column-grid">
        <aside class="panel" id="reels-filter-section"><h2>Reels</h2><div class="stack"><button id="reels-for-you-btn" class="btn btn-primary" type="button">For You</button><button id="reels-following-btn" class="btn btn-secondary" type="button">Following</button><button id="reels-trending-btn" class="btn btn-secondary" type="button">Trending</button><button id="reels-audio-btn" class="btn btn-secondary" type="button">Audio</button></div></aside>
        <section class="stack" id="reels-player-section" data-endpoint="/api/reels"><article class="post-card"><div class="post-header"><span class="avatar">W</span><div><h2>WanderLens</h2><p>3h ago - Mountain audio</p></div><button id="reel-more-btn" class="icon-btn" type="button">...</button></div><figure class="media-scene portrait"><span class="media-label">Reel</span><figcaption class="media-caption"><strong>Nature does not hurry, yet everything is accomplished.</strong><p>#NatureVibes #MountainLife #TravelMore</p></figcaption></figure><div class="post-actions"><button id="reel-like-btn" type="button">Like 125K</button><button id="reel-comment-btn" type="button">Comments 1,234</button><button id="reel-share-btn" type="button">Share</button><button id="reel-save-btn" type="button">Save</button></div></article></section>
        <aside class="right-rail"><section class="rail-card" id="reels-comments-section" data-endpoint="/api/reels/:id/comments"></section><section class="rail-card" id="reels-suggested-section" data-endpoint="/api/reels/suggested"></section></aside>
      </div>
    </main>
  </div>
  <nav class="mobile-nav"></nav>
  <script src="js/config.js"></script><script src="js/storage.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/navigation.js"></script><script src="js/reels.js"></script><script src="js/theme.js"></script><script src="js/app.js"></script>
</body>
</html>
